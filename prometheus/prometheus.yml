#prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api                 # métricas HTTP de la API (/metrics)
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker              # métricas internas del SDK de Temporal
    static_configs:
      - targets: ["worker:9464"]

  - job_name: worker-app          # tus métricas de CPU/RAM/disco
    scrape_interval: 5s         # opcional: la lectura ocurre cada ~6 s
    static_configs:
      - targets: ["worker:9465"]

  - job_name: temporal
    metrics_path: /metrics
    static_configs:
      - targets: ["temporal:8000"]
