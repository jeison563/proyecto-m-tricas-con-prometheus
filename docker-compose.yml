#docker_compose
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: db
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000   # métricas del servidor Temporal
    ports:
      - "127.0.0.1:7233:7233"
    # RIESGO: no verifiqué que `tctl` exista en esta imagen. Si el servicio
    # nunca pasa a "healthy", revisa este comando con `docker compose logs temporal`.
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 15

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8080:8080"

  api:
    build: .
    # Migra la BD y luego arranca la API
    command: sh -c "alembic upgrade head && uvicorn app.life_span:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"     # opcional: puedes quitarlo, Nginx llega por la red interna
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: .
    command: python -m app.worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy   # la API ya migró la base de datos
    expose:
      - "9464"
      - "9465"

  nginx:
    image: nginx:1.27-alpine          # [Verifica] que el tag exista en Docker Hub
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # - ./alertmanager/smtp_password:/etc/alertmanager/smtp_password:ro   # si usas correo
      - alertdata:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux para host.docker.internal
    ports:
      - "127.0.0.1:9093:9093"

volumes:
  pgdata:
  promdata:
  alertdata:
