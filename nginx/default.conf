#nginx/default.conf
# Limita intentos de login: 5 por minuto por IP (+5 de margen)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Chart.js se sirve desde /vendor (mismo origen), por eso script-src solo permite 'self'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" always;

    # Rutas internas que NO deben verse desde fuera (también con "/" final o subrutas)
    location ~ ^/api/(metrics|alerts)(/|$) { return 404; }

    # Login con límite de intentos
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://api:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto de la API: /api/hosts -> http://api:8000/hosts (quita el prefijo /api)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
